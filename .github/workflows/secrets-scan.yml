name: Secrets scan

# Scans history and PR diffs for committed secrets with gitleaks.
# This workflow is read-only and executes no repo code, so -- unlike
# gpu-tests.yml, which must NEVER run on pull_request -- it is safe
# on fork PRs, and that is exactly where it earns its keep: it keeps a
# secret out of the public history in the first place.
# See docs/secret-hygiene.md for the three-layer secret architecture.
on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
